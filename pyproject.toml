[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
# PyPI distribution name. The plain `sendly` name is owned by an unrelated
# SMS company on PyPI, so we publish as `sendly-python` (matches the repo and
# the PyPI trusted-publisher configuration). The import package is
# unchanged (`import sendly`) — see [tool.hatch.build.targets.wheel] below.
name = "sendly-python"
version = "0.2.0"
description = "Official Sendly Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Devino Solutions", email = "dev@devino.ca" }]
keywords = ["sendly", "email", "api", "sdk", "transactional-email", "webhooks"]
dependencies = ["httpx==0.28.1"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.9.6",
    "mypy==1.15.0",
]

[project.urls]
Homepage = "https://sendly.now"
Documentation = "https://docs.sendly.now"
Repository = "https://github.com/DevinoSolutions/sendly-python"

[tool.hatch.build.targets.wheel]
packages = ["src/sendly"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "W"]
# Line length is owned by the formatter; the linter does not double-check it.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
